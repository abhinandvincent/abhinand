{% extends 'admin/adminheader.html' %}
{% load static %}

{% block content %}
<style>
    .admin-card {
        background: #0a0a0a;
        border: 1px solid #1a1a1a;
        border-radius: 4px;
        overflow: hidden;
    }

    .card-header-accent {
        background: #000;
        border-bottom: 1px solid #1a1a1a;
        padding: 30px 40px;
    }

    .form-control-custom {
        background: #111 !important;
        border: 1px solid #1a1a1a !important;
        color: #fff !important;
        padding: 15px 20px;
        border-radius: 2px;
        transition: 0.4s;
        width: 100%;
    }

    .form-control-custom:focus {
        border-color: #0070d1 !important;
        box-shadow: 0 0 15px rgba(0, 112, 209, 0.1) !important;
        outline: none;
    }

    .form-control-custom::placeholder {
        color: #444;
    }

    .field-label {
        color: #71717a;
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 12px;
        display: block;
    }

    .btn-submit {
        background: #0070d1;
        color: #fff;
        border: none;
        padding: 12px 35px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.8rem;
        border-radius: 2px;
        transition: 0.3s;
    }

    .btn-submit:hover {
        background: #005bb1;
        transform: translateY(-2px);
    }

    .btn-reset {
        background: transparent;
        color: #444;
        border: 1px solid #1a1a1a;
        padding: 12px 25px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.8rem;
        border-radius: 2px;
        margin-right: 10px;
    }

    .btn-reset:hover {
        border-color: #333;
        color: #71717a;
    }

    .error-message {
        color: #ff4d4d;
        font-size: 0.75rem;
        margin-top: 6px;
    }
</style>

<div class="admin-card">
    <div class="card-header-accent">
        <h4 class="fw-800 mb-1 text-white text-uppercase" style="letter-spacing: -1px;">
            Register Delivery Boy
        </h4>

        <p class="text-secondary small mb-0">
            Add a new delivery staff member to the logistics network.
        </p>
    </div>

    <div class="card-body p-5">
        <form method="POST" id="deliveryForm">
            {% csrf_token %}

            <div class="row g-4">

                <!-- Name -->
                <div class="col-md-6">
                    <label class="field-label">Full Name</label>

                    <input type="text"
                           name="name"
                           id="name"
                           class="form-control-custom"
                           placeholder="ENTER FULL NAME..."
                           required>

                    <div class="error-message" id="nameError"></div>
                </div>

                <!-- Email -->
                <div class="col-md-6">
                    <label class="field-label">Email Address</label>

                    <input type="email"
                           name="email"
                           id="email"
                           class="form-control-custom"
                           placeholder="ENTER EMAIL ADDRESS..."
                           required>

                    <div class="error-message" id="emailError"></div>
                </div>

                <!-- Phone -->
                <div class="col-md-6">
                    <label class="field-label">Phone Number</label>

                    <input type="text"
                           name="contact"
                           id="contact"
                           class="form-control-custom"
                           placeholder="ENTER PHONE NUMBER..."
                           required>

                    <div class="error-message" id="contactError"></div>
                </div>

                <!-- Address -->
                <div class="col-md-6">
                    <label class="field-label">Address</label>

                    <input type="text"
                           name="address"
                           id="address"
                           class="form-control-custom"
                           placeholder="ENTER ADDRESS..."
                           required>

                    <div class="error-message" id="addressError"></div>
                </div>

                <!-- Username -->
                <div class="col-md-6">
                    <label class="field-label">Username</label>

                    <input type="text"
                           name="username"
                           id="username"
                           class="form-control-custom"
                           placeholder="ENTER USERNAME..."
                           required>

                    <div class="error-message" id="usernameError"></div>
                </div>

                <!-- Password -->
                <div class="col-md-6">
                    <label class="field-label">Password</label>

                    <input type="password"
                           name="password"
                           id="password"
                           class="form-control-custom"
                           placeholder="ENTER PASSWORD..."
                           required>

                    <div class="error-message" id="passwordError"></div>
                </div>

                <!-- Buttons -->
                <div class="col-12 mt-5 pt-4 d-flex justify-content-between align-items-center"
                     style="border-top: 1px solid #1a1a1a;">

                    <div class="d-flex align-items-center text-secondary"
                         style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;">

                        <i class="bi bi-shield-lock me-2 text-primary"></i>
                        Secure Validated Entry
                    </div>

                    <div class="buttons">
                        <button type="reset" class="btn-reset">
                            Discard
                        </button>

                        <button type="submit" class="btn-submit">
                            Add Delivery Boy
                        </button>
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById("deliveryForm").addEventListener("submit", function(e) {

        let isValid = true;

        // Clear old errors
        document.querySelectorAll(".error-message").forEach(el => {
            el.innerHTML = "";
        });

        // Name Validation
        let name = document.getElementById("name").value.trim();

        if (name.length < 3) {
            document.getElementById("nameError").innerHTML =
                "Name must contain at least 3 characters";
            isValid = false;
        }

        // Email Validation
        let email = document.getElementById("email").value.trim();

        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

        if (!email.match(emailPattern)) {
            document.getElementById("emailError").innerHTML =
                "Enter a valid email address";
            isValid = false;
        }

        // Phone Validation
        let contact = document.getElementById("contact").value.trim();

        let phonePattern = /^[0-9]{10}$/;

        if (!contact.match(phonePattern)) {
            document.getElementById("contactError").innerHTML =
                "Phone number must be 10 digits";
            isValid = false;
        }

        // Address Validation
        let address = document.getElementById("address").value.trim();

        if (address.length < 2) {
            document.getElementById("addressError").innerHTML =
                "Address is required";
            isValid = false;
        }

        // Username Validation
        let username = document.getElementById("username").value.trim();

        if (username.length < 4) {
            document.getElementById("usernameError").innerHTML =
                "Username must contain at least 4 characters";
            isValid = false;
        }

        // Password Validation
        let password = document.getElementById("password").value;

        if (password.length < 6) {
            document.getElementById("passwordError").innerHTML =
                "Password must contain at least 6 characters";
            isValid = false;
        }

        // Prevent submit
        if (!isValid) {
            e.preventDefault();
        }
    });
</script>

{% endblock %}
