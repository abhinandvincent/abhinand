{% extends 'admin/adminheader.html' %}
{% load static %}

{% block content %}
<style>
    .admin-card {
        background: #0a0a0a;
        border: 1px solid #1a1a1a;
        border-radius: 4px;
        overflow: hidden;
    }

    .card-header-accent {
        background: #000;
        border-bottom: 1px solid #1a1a1a;
        padding: 30px 40px;
    }

    .form-control-custom {
        background: #111 !important;
        border: 1px solid #1a1a1a !important;
        color: #fff !important;
        padding: 12px 18px;
        border-radius: 2px;
        transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .form-control-custom:focus {
        border-color: #0070d1 !important;
        box-shadow: 0 0 15px rgba(0, 112, 209, 0.1) !important;
        outline: none;
    }

    select.form-control-custom {
        appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%2371717a'%3e%3cpath fill-rule='evenodd' d='M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: 14px 10px;
    }

    .field-label {
        color: #71717a;
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
        display: block;
    }

    .btn-submit {
        background: #0070d1;
        color: #fff;
        border: none;
        padding: 14px 40px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 0.8rem;
        border-radius: 2px;
        transition: 0.3s;
    }

    .btn-submit:hover {
        background: #005bb1;
        transform: translateY(-2px);
    }

    textarea.form-control-custom {
        min-height: 120px;
        resize: none;
    }

    /* Custom File Input Styling */
    input[type="file"].form-control-custom::file-selector-button {
        background: #1a1a1a;
        color: #71717a;
        border: 1px solid #333;
        padding: 5px 15px;
        margin-right: 15px;
        border-radius: 2px;
        cursor: pointer;
        text-transform: uppercase;
        font-size: 0.6rem;
        letter-spacing: 1px;
    }

    input[type="file"].form-control-custom::file-selector-button:hover {
        background: #222;
        color: #fff;
    }
</style>

<div class="admin-card">
    <div class="card-header-accent">
        <h4 class="fw-800 mb-1 text-white text-uppercase" style="letter-spacing: -1px;">Inventory Induction</h4>
        <p class="text-secondary small mb-0">Add high-end hardware components to the global digital catalog.</p>
    </div>
    
    <div class="card-body p-5">
        <form method="post" action="{% url 'add_product' %}" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row g-4">
                <div class="col-md-8">
                    <label class="field-label">System / Product Nomenclature</label>
                    <input type="text" name="product_name" class="form-control-custom w-100" placeholder="E.G. SONY BRAVIA XR-75..." required>
                </div>

                <div class="col-md-4">
                    <label class="field-label">Unit Valuation (₹)</label>
                    <input type="number" name="product_price" class="form-control-custom w-100" placeholder="0.00" required>
                </div>

                <div class="col-md-6">
                    <label class="field-label">Classification Category</label>
                    <select name="category" class="form-control-custom w-100" required>
                        <option value="" disabled selected>SELECT CLASSIFICATION...</option>
                        {% for category in categories %}
                            <option value="{{ category.category_id }}" style="background: #0a0a0a;">{{ category.category_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="field-label">Stock Inventory Count</label>
                    <input type="number" name="quantity" class="form-control-custom w-100" placeholder="AVAILABLE UNITS" required>
                </div>

                <div class="col-12">
                    <label class="field-label">Technical Specifications & Overview</label>
                    <textarea name="product_description" class="form-control-custom w-100" placeholder="PROVIDE DETAILED HARDWARE SPECS..."></textarea>
                </div>

                <div class="col-12">
                    <label class="field-label">Visual Asset Upload</label>
                    <input type="file" name="product_image" class="form-control-custom w-100">
                </div>

                <div class="col-12 mt-5 pt-4 d-flex justify-content-between align-items-center" style="border-top: 1px solid #1a1a1a;">
                    <div class="d-flex align-items-center text-secondary" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;">
                        <i class="bi bi-box-seam me-2 text-primary"></i> 
                        Ready for Global Distribution
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        Induct Product
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
