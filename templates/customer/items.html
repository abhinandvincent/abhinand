{% extends 'customerheader.html' %}
{% load static %}
{% block content %}

<style>
    body {
        background: #000000;
        font-family: 'Inter', sans-serif;
        color: #ffffff;
    }

    .page-header {
        margin-top: 60px;
        margin-bottom: 40px;
        border-left: 4px solid #0070d1;
        padding-left: 20px;
    }

    .page-header h2 {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -1px;
        text-transform: uppercase;
        margin: 0;
    }

    .page-header p {
        color: #a1a1aa;
        font-size: 1rem;
        margin-top: 5px;
    }

    /* Premium Filter Bar */
    .filter-box select,
    .filter-box button {
        padding: 12px 20px;
        border-radius: 4px;
        border: 1px solid #1a1a1a;
        background: #0a0a0a;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.3s;
    }

    .filter-box select:focus {
        border-color: #0070d1;
        outline: none;
    }

    .filter-box button:hover {
        background: #0070d1;
        border-color: #0070d1;
    }

    /* Inventory Cards */
    .inventory-card {
        background: #0a0a0a;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid #1a1a1a;
        transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        height: 100%;
    }

    .inventory-card:hover {
        transform: translateY(-8px);
        border-color: #0070d1;
        box-shadow: 0 12px 40px rgba(0, 112, 209, 0.15);
    }

    .card-img {
        height: 240px;
        overflow: hidden;
        position: relative;
        background: #111;
    }

    .card-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease;
    }

    .inventory-card:hover .card-img img {
        transform: scale(1.08);
    }

    .badge-custom {
        position: absolute;
        top: 15px;
        left: 15px;
        background: #0070d1;
        color: #fff;
        font-size: 0.7rem;
        font-weight: 800;
        padding: 6px 12px;
        border-radius: 2px;
        text-transform: uppercase;
        letter-spacing: 1px;
        z-index: 10;
    }

    .card-body {
        padding: 24px;
    }

    .item-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 5px;
        letter-spacing: -0.5px;
    }

    .item-price {
        font-weight: 300;
        color: #0070d1;
        font-size: 1.1rem;
    }

    .specs {
        display: flex;
        gap: 15px;
        margin: 20px 0;
        font-size: 0.75rem;
        color: #71717a;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .specs span {
        background: #151515;
        padding: 4px 8px;
        border-radius: 2px;
    }

    .btn-view {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 2px;
        background: #fff;
        color: #000;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        transition: 0.3s;
    }

    .btn-view:hover {
        background: #0070d1;
        color: #fff;
    }

    /* Out of Stock Logic */
    .sold-out {
        filter: grayscale(1);
        opacity: 0.7;
    }

    .sold-out .badge-custom {
        background: #333;
    }

    .sold-out .btn-view {
        background: #1a1a1a;
        color: #555;
        cursor: not-allowed;
    }
</style>

<section class="container py-5 mb-5">

    <div class="page-header d-flex justify-content-between align-items-end flex-wrap gap-4">
        <div>
            <h2>Explore Hardware</h2>
            <p>Engineered for the ultimate digital experience.</p>
        </div>

        <div class="filter-box d-flex gap-3">
            <select>
                <option>All Collections</option>
                <option>Visuals</option>
                <option>Audio</option>
                <option>Mobile</option>
            </select>

            <button><i class="bi bi-sliders me-2"></i>Refine</button>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-lg-4 col-md-6">
            <div class="inventory-card">
                <div class="card-img">
                    <span class="badge-custom">New Arrival</span>
                    <img src="https://images.unsplash.com/photo-1593305841991-05c297ba4575?auto=format&fit=crop&q=80&w=1000" alt="Hardware">
                </div>

                <div class="card-body">
                    <div class="item-title">Alpha Vision Z1</div>
                    <div class="item-price">₹1,84,500</div>

                    <div class="specs">
                        <span>4K HDR</span>
                        <span>120Hz</span>
                        <span>OLED</span>
                    </div>

                    <button class="btn-view">View Specifications</button>
                </div>
            </div>
        </div>

        <div class="col-lg-4 col-md-6">
            <div class="inventory-card sold-out">
                <div class="card-img">
                    <span class="badge-custom">Backordered</span>
                    <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&q=80&w=1000" alt="Hardware">
                </div>

                <div class="card-body">
                    <div class="item-title">Sonic Pro Wireless</div>
                    <div class="item-price">₹24,900</div>

                    <div class="specs">
                        <span>ANC</span>
                        <span>30h Battery</span>
                        <span>Hi-Res</span>
                    </div>

                    <button class="btn-view" disabled>Out of Stock</button>
                </div>
            </div>
        </div>

    </div>

</section>

{% endblock %}
